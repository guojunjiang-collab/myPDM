version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bom_postgres
    environment:
      POSTGRES_USER: bomadmin
      POSTGRES_PASSWORD: bompass
      POSTGRES_DB: bom_system
    volumes:
      - ${PGDATA_HOST_PATH:-./pgdata}:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - bom_network

  redis:
    image: redis:7-alpine
    container_name: bom_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    restart: unless-stopped
    networks:
      - bom_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bom_backend
    # 开发环境：源码以卷挂载，开启 --reload 使后端代码改动自动生效。
    # 否则改了后端代码但进程未重载会导致新路由 404（旧 uvicorn 进程仍用旧路由表）。
    # 生产环境请勿开启 --reload。
    # 生产环境请勿开启 --reload。
    # 容器内 chown 需 root 权限，用 user: "0:0" 覆盖 Dockerfile 的 USER appuser
    user: "0:0"
    entrypoint: sh -c "chown -R appuser:appuser /app/uploads && exec su appuser -c 'uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'"
    environment:
      - POSTGRES_USER=bomadmin
      - POSTGRES_PASSWORD=bompass
      - POSTGRES_DB=bom_system
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/app/uploads
      - CHUNK_DIR=/app/uploads/chunks
      - MAX_FILE_SIZE=1073741824
      - CHUNK_SIZE=5242880
      - APP_ENV=development
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - ASSISTANT_MAX_ITERS=${ASSISTANT_MAX_ITERS:-8}
      - ASSISTANT_BOM_RAW_THRESHOLD=${ASSISTANT_BOM_RAW_THRESHOLD:-200}
      - ASSISTANT_SENSITIVE_FIELDS=${ASSISTANT_SENSITIVE_FIELDS:-}
      - ASSISTANT_API_MAX_CHARS=${ASSISTANT_API_MAX_CHARS:-8000}
      - ASSISTANT_API_TIMEOUT=${ASSISTANT_API_TIMEOUT:-15}
      - ASSISTANT_ATTACHMENT_MAX_CHARS=${ASSISTANT_ATTACHMENT_MAX_CHARS:-20000}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET not set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD not set}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost:8080}
      - CAD_PDF_PART_PREFIX=${CAD_PDF_PART_PREFIX:-DR_}
      - CAD_PDF_ASSEMBLY_PREFIX=${CAD_PDF_ASSEMBLY_PREFIX:-ASY_}
      - CAD_STP_PREFIX=${CAD_STP_PREFIX:-MD_}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_EH_APP_ID=${FEISHU_EH_APP_ID:-}
      - FEISHU_EH_APP_SECRET=${FEISHU_EH_APP_SECRET:-}
      - FEISHU_REDIRECT_BASE=${FEISHU_REDIRECT_BASE:-https://192.168.61.105:8080}
    volumes:
      - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
      - ./backend/app:/app/app
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - bom_network

  nginx:
    image: nginx:alpine
    container_name: bom_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bom_network
    ports:
      - "${NGINX_HOST_PORT:-8080}:443"
      - "${NGINX_HTTP_HOST_PORT:-8081}:80"

networks:
  bom_network:
    driver: bridge
