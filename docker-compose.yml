version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bom_postgres
    environment:
      POSTGRES_USER: bomadmin
      POSTGRES_PASSWORD: bompass
      POSTGRES_DB: bom_system
    volumes:
      - ${PGDATA_HOST_PATH:-./pgdata}:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - bom_network

  redis:
    image: redis:7-alpine
    container_name: bom_redis
    networks:
      - bom_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bom_backend
    environment:
      - POSTGRES_USER=bomadmin
      - POSTGRES_PASSWORD=bompass
      - POSTGRES_DB=bom_system
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UPLOAD_DIR=/app/uploads
      - CHUNK_DIR=/app/uploads/chunks
      - MAX_FILE_SIZE=1073741824
      - CHUNK_SIZE=5242880
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - ASSISTANT_MAX_ITERS=${ASSISTANT_MAX_ITERS:-8}
      - ASSISTANT_BOM_RAW_THRESHOLD=${ASSISTANT_BOM_RAW_THRESHOLD:-200}
      - ASSISTANT_SENSITIVE_FIELDS=${ASSISTANT_SENSITIVE_FIELDS:-}
      - ASSISTANT_API_MAX_CHARS=${ASSISTANT_API_MAX_CHARS:-8000}
      - ASSISTANT_API_TIMEOUT=${ASSISTANT_API_TIMEOUT:-15}
    volumes:
      - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
      - ./backend/app:/app/app
    depends_on:
      - postgres
      - redis
    networks:
      - bom_network
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: bom_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - bom_network
    ports:
      - "${NGINX_HOST_PORT:-8080}:443"

networks:
  bom_network:
    driver: bridge