<svg viewBox="0 0 800 470" width="800" height="470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif" role="img">
  <title>整机递归展平世界矩阵示意</title>
  <desc>多级装配 BOM 树深度优先遍历，world = 父件世界矩阵 × 本地矩阵 逐层累乘，输出带世界矩阵的叶子实例清单。</desc>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#26215C">整机递归展平：world = 父件世界 × 本地矩阵</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#6B6875">深度优先遍历 BOM 树，逐层累乘，只对有几何的叶子输出实例（对应 DocDoku 的 generateInstanceStreamWithGlobalMatrix）</text>

  <text x="40" y="82" font-size="13" font-weight="700" fill="#3C3489">装配 BOM 树（本地矩阵挂在边上）</text>

  <path d="M70,110 L70,345" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
  <path d="M70,167 L120,167" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
  <path d="M70,345 L120,345" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
  <path d="M150,184 L150,269" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
  <path d="M150,229 L190,229" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>
  <path d="M150,269 L190,269" fill="none" stroke="#AFA9EC" stroke-width="1.4"/>

  <rect x="40" y="90" width="160" height="34" rx="7" fill="#CECBF6" stroke="#7F77DD" stroke-width="1.4"/>
  <text x="54" y="106" font-size="13" font-weight="700" fill="#26215C">总装 ASM</text>
  <text x="54" y="119" font-size="10" fill="#534AB7">world = 根（Z-up）</text>

  <rect x="120" y="150" width="150" height="34" rx="7" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.3"/>
  <text x="132" y="171" font-size="12" font-weight="700" fill="#3C3489">子装配 SUB-A</text>
  <text x="86" y="162" font-size="11" font-family="Consolas,monospace" fill="#534AB7">× Mₐ</text>

  <rect x="190" y="214" width="150" height="30" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="202" y="233" font-size="12" font-weight="700" fill="#0F6E56">螺钉M6 · 实例1</text>
  <text x="156" y="224" font-size="10" font-family="Consolas,monospace" fill="#1D9E75">× M_b1</text>

  <rect x="190" y="254" width="150" height="30" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="202" y="273" font-size="12" font-weight="700" fill="#0F6E56">螺钉M6 · 实例2</text>
  <text x="156" y="264" font-size="10" font-family="Consolas,monospace" fill="#1D9E75">× M_b2</text>

  <rect x="120" y="330" width="150" height="30" rx="7" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.4"/>
  <text x="132" y="349" font-size="12" font-weight="700" fill="#0F6E56">支架 BRACKET</text>
  <text x="86" y="340" font-size="11" font-family="Consolas,monospace" fill="#1D9E75">× M_c</text>

  <text x="40" y="392" font-size="11" fill="#6B6875">■ 蓝＝装配节点（继续下钻）　■ 绿＝叶子（有几何→输出实例）</text>

  <defs>
    <marker id="fa" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#534AB7"/>
    </marker>
  </defs>
  <path d="M352,250 L452,250" fill="none" stroke="#534AB7" stroke-width="1.8" marker-end="url(#fa)"/>
  <text x="402" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#534AB7">展平</text>

  <rect x="462" y="86" width="316" height="300" rx="10" fill="#F7F6FF" stroke="#7F77DD" stroke-width="1.3"/>
  <text x="620" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#3C3489">展平结果：叶子实例 + 世界矩阵</text>

  <g font-family="Consolas,monospace">
    <rect x="482" y="128" width="276" height="66" rx="7" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="496" y="150" font-size="12" font-weight="700" fill="#0F6E56" font-family="system-ui">螺钉M6 · 实例1</text>
    <text x="496" y="170" font-size="12" fill="#26215C">world = Mₐ × M_b1</text>
    <text x="496" y="186" font-size="10" fill="#6B6875">glb = 螺钉M6.glb（复用）</text>

    <rect x="482" y="202" width="276" height="66" rx="7" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="496" y="224" font-size="12" font-weight="700" fill="#0F6E56" font-family="system-ui">螺钉M6 · 实例2</text>
    <text x="496" y="244" font-size="12" fill="#26215C">world = Mₐ × M_b2</text>
    <text x="496" y="260" font-size="10" fill="#6B6875">glb = 螺钉M6.glb（复用）</text>

    <rect x="482" y="276" width="276" height="66" rx="7" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="496" y="298" font-size="12" font-weight="700" fill="#0F6E56" font-family="system-ui">支架 BRACKET</text>
    <text x="496" y="318" font-size="12" fill="#26215C">world = M_c</text>
    <text x="496" y="334" font-size="10" fill="#6B6875">glb = BRACKET.glb</text>
  </g>
  <text x="620" y="368" text-anchor="middle" font-size="11" fill="#534AB7">前端不做树运算：拿到清单 → clone glb → 贴 world</text>

  <text x="400" y="432" text-anchor="middle" font-size="12" font-weight="700" fill="#26215C">world = 父件世界矩阵 × 本地矩阵　（沿路径从根到叶逐层右乘）</text>
  <text x="400" y="452" text-anchor="middle" font-size="11" fill="#6B6875">Z-up→Y-up 只在装配根施加一次；平移已归一化为米</text>
</svg>
