<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', system-ui, sans-serif">
  <title>多实例变换矩阵存储示意</title>
  <desc>一行 BOMItem 用 quantity=4 与 cad_instances 数组存 4 个不同的变换矩阵，共享一个零件 glb，展平后在装配世界坐标系里摆成 4 个实例。</desc>

  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#26215C">多实例变换矩阵存储：一行 BOMItem 挂 N 个矩阵</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#6B6875">同一零件被调用多次 · 每个实例位姿不同 · 数量说"几个"，矩阵数组说"每个在哪"</text>

  <rect x="24" y="78" width="276" height="356" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="40" y="104" font-size="14" font-weight="700" fill="#3C3489">BOMItem（逻辑 BOM 一行）</text>

  <text x="40" y="132" font-size="13" fill="#534AB7">parent · 支架总成</text>
  <text x="40" y="154" font-size="13" fill="#534AB7">child&#160;&#160;· 螺钉M6</text>

  <rect x="40" y="168" width="150" height="26" rx="5" fill="#CECBF6" stroke="#7F77DD"/>
  <text x="50" y="186" font-size="13" font-weight="700" fill="#26215C">quantity = 4</text>
  <text x="200" y="186" font-size="11" fill="#6B6875">← 只说数量</text>

  <line x1="40" y1="210" x2="284" y2="210" stroke="#AFA9EC" stroke-dasharray="3 3"/>
  <text x="40" y="230" font-size="12" font-weight="700" fill="#3C3489">cad_instances[]</text>
  <text x="152" y="230" font-size="11" fill="#6B6875">新增 JSONB 列</text>

  <g font-family="'SFMono-Regular',Consolas,monospace">
    <rect x="40" y="244" width="112" height="38" rx="6" fill="#fff" stroke="#7F77DD"/>
    <text x="52" y="262" font-size="12" font-weight="700" fill="#534AB7">M₁</text>
    <text x="52" y="277" font-size="10" fill="#6B6875">→ 孔位1</text>

    <rect x="164" y="244" width="112" height="38" rx="6" fill="#fff" stroke="#7F77DD"/>
    <text x="176" y="262" font-size="12" font-weight="700" fill="#534AB7">M₂</text>
    <text x="176" y="277" font-size="10" fill="#6B6875">→ 孔位2</text>

    <rect x="40" y="290" width="112" height="38" rx="6" fill="#fff" stroke="#7F77DD"/>
    <text x="52" y="308" font-size="12" font-weight="700" fill="#534AB7">M₃</text>
    <text x="52" y="323" font-size="10" fill="#6B6875">→ 孔位3</text>

    <rect x="164" y="290" width="112" height="38" rx="6" fill="#fff" stroke="#7F77DD"/>
    <text x="176" y="308" font-size="12" font-weight="700" fill="#534AB7">M₄</text>
    <text x="176" y="323" font-size="10" fill="#6B6875">→ 孔位4</text>
  </g>
  <text x="40" y="352" font-size="11" fill="#534AB7">每个元素 = 一个 4×4 本地矩阵</text>
  <text x="40" y="370" font-size="11" fill="#534AB7">{ matrix:[16], source, label }</text>
  <text x="40" y="396" font-size="12" font-weight="700" fill="#26215C">一行挂 4 个矩阵 = 摆 4 处</text>
  <text x="40" y="416" font-size="11" fill="#6B6875">不新增行、不改 BOM 语义</text>

  <rect x="340" y="180" width="132" height="76" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="406" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E56">螺钉M6.glb</text>
  <text x="406" y="232" text-anchor="middle" font-size="11" fill="#1D9E75">几何只下载 1 次</text>
  <text x="406" y="248" text-anchor="middle" font-size="10" fill="#6B6875">clone ×4 · 各贴一个矩阵</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#534AB7"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1D9E75"/>
    </marker>
  </defs>

  <path d="M300,266 C420,266 430,150 508,150" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="410" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#534AB7">① 展平累乘</text>
  <text x="410" y="136" text-anchor="middle" font-size="10" font-family="Consolas,monospace" fill="#6B6875">world = Wₚ × Mᵢ</text>

  <path d="M472,222 C492,240 492,300 508,308" fill="none" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#ah2)"/>
  <text x="486" y="356" text-anchor="middle" font-size="10" fill="#1D9E75">② clone 贴矩阵</text>

  <rect x="512" y="86" width="270" height="330" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="647" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#4A1B0C">支架总成 · 世界坐标系</text>

  <g>
    <circle cx="580" cy="170" r="17" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="580" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#0F6E56">M₁</text>
    <circle cx="712" cy="205" r="17" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="712" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#0F6E56">M₂</text>
    <circle cx="600" cy="300" r="17" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="600" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#0F6E56">M₃</text>
    <circle cx="720" cy="335" r="17" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1.5"/>
    <text x="720" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#0F6E56">M₄</text>
  </g>
  <text x="647" y="392" text-anchor="middle" font-size="11" fill="#993C1D">4 颗同款螺钉 · 4 个不同位置</text>

  <text x="400" y="462" text-anchor="middle" font-size="11" fill="#6B6875">cad_instances 为空时 → 退化为单位矩阵摆原点（纯逻辑 BOM，尚未导入装配 STEP）</text>
</svg>
