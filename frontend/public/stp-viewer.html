<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STP 三维预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: system-ui, sans-serif; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; background: #ffffff; color: #999; font-size: 14px; }
    #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; background: #ffffff; color: #d44; font-size: 14px; text-align: center; padding: 20px; }
    model-viewer { width: 100vw; height: 100vh; background-color: #ffffff; }
    #toolbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
    #toolbar button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #f5f5f5; color: #555; font-size: 12px; cursor: pointer; }
    #toolbar button:hover { background: #e8e8e8; color: #222; }
  </style>
</head>
<body>
  <div id="loading">模型加载中...</div>
  <div id="error">模型加载失败<br><small style="color:#bbb">请确认 STP 文件转换是否成功</small></div>
  <div id="converting" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10;background:#fff;color:#666;font-size:14px;text-align:center;padding:20px;flex-direction:column;gap:8px">
    <div>模型转换中，请稍后...</div>
    <div style="color:#999;font-size:12px" id="converting-hint">正在自动重试</div>
  </div>

  <div id="viewer-container" style="width:100vw;height:100vh"></div>

  <div id="toolbar">
    <button onclick="resetCamera()">重置视角</button>
    <button onclick="toggleAutoRotate()">自动旋转</button>
  </div>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
  <script>
    console.log('[STP Viewer] 页面加载');

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const token = params.get('token');
    console.log('[STP Viewer] 附件ID:', id);

    const container = document.getElementById('viewer-container');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const converting = document.getElementById('converting');
    const convertingHint = document.getElementById('converting-hint');

    if (!id || !token) {
      error.style.display = 'flex';
      error.innerHTML = '缺少认证参数';
      loading.style.display = 'none';
    } else {
      const url = `/api/v2/attachments/${id}/gltf?token=${encodeURIComponent(token)}`;
      loadModel(url);
    }

    async function loadModel(url) {
      // 先检查后端是否返回 GLB（200）还是转换中（202）
      try {
        const resp = await fetch(url, { method: 'HEAD' });
        if (resp.status === 202) {
          // 转换中 → 显示提示 + 轮询
          loading.style.display = 'none';
          converting.style.display = 'flex';
          await pollUntilReady(url);
          return;
        }
        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status);
        }
      } catch (e) {
        // HEAD 可能不支持，直接尝试加载
        console.log('[STP Viewer] HEAD check skipped, trying direct load');
      }

      console.log('[STP Viewer] 等待 model-viewer 注册...');
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('CDN超时')), 10000));
      try {
        await Promise.race([customElements.whenDefined('model-viewer'), timeout]);
      } catch (e) {
        loading.style.display = 'none';
        error.style.display = 'flex';
        error.innerHTML = '3D组件加载失败<br><small>CDN资源可能无法访问</small>';
        return;
      }
      createViewer(url);
    }

    async function pollUntilReady(url) {
      let retries = 0;
      const maxRetries = 30; // 最多轮询 60 秒
      while (retries < maxRetries) {
        await new Promise(r => setTimeout(r, 2000));
        retries++;
        try {
          const resp = await fetch(url, { method: 'HEAD' });
          if (resp.status === 200) {
            convertingHint.textContent = '转换完成，加载模型中...';
            await customElements.whenDefined('model-viewer');
            converting.style.display = 'none';
            createViewer(url);
            return;
          }
          if (resp.status === 202) {
            convertingHint.textContent = `正在自动重试 (${retries}/${maxRetries})`;
            continue;
          }
          // 非 200/202 → 出错
          throw new Error('HTTP ' + resp.status);
        } catch (e) {
          converting.style.display = 'none';
          error.style.display = 'flex';
          error.innerHTML = '模型加载失败<br><small>' + e.message + '</small>';
          return;
        }
      }
      // 超时
      converting.style.display = 'none';
      error.style.display = 'flex';
      error.innerHTML = '转换超时<br><small>请关闭后重试</small>';
    }

    function createViewer(url) {
          console.log('[STP Viewer] 创建 model-viewer, src:', url);
          const viewer = document.createElement('model-viewer');
          viewer.setAttribute('src', url);
          viewer.setAttribute('camera-controls', '');
          viewer.setAttribute('auto-rotate', '');
          viewer.setAttribute('auto-rotate-delay', '3000');
          viewer.setAttribute('environment-image', 'neutral');
          viewer.setAttribute('exposure', '1.3');
          viewer.setAttribute('shadow-intensity', '0.6');
          viewer.setAttribute('shadow-softness', '1');
          viewer.setAttribute('tone-mapping', 'aces');
          viewer.style.width = '100%';
          viewer.style.height = '100%';

          viewer.addEventListener('load', () => {
            console.log('[STP Viewer] 模型加载成功');
            loading.style.display = 'none';
          });
          viewer.addEventListener('error', (e) => {
            console.error('[STP Viewer] 模型加载失败', e);
            loading.style.display = 'none';
            error.style.display = 'flex';
          });

          container.appendChild(viewer);
          window._viewer = viewer;
    }

    function resetCamera() {
      if (window._viewer) {
        window._viewer.cameraOrbit = '45deg 75deg auto';
        window._viewer.resetTurntableRotation();
      }
    }
    function toggleAutoRotate() {
      if (window._viewer) window._viewer.autoRotate = !window._viewer.autoRotate;
    }
  </script>
</body>
</html>
