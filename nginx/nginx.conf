# 速率限制区域定义
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
# api 区放宽：批量导入/导出、文档页每行一个请求等合法操作会瞬时产生大量请求，
# 30r/s 会误伤。100r/s + 大 burst 仍能挡住明显的滥用。
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

# 被限流时返回明确的 429，而不是 503（再被 error_page 改写成误导性的 404）
limit_req_status 429;
limit_conn_status 429;

server {
    listen       443 ssl;
    server_name  localhost;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # SSL 强化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 隐藏版本信息
    server_tokens off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 全局请求体限制（静态资源）
    client_max_body_size 10m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 登录接口 - 严格限流
    location /api/auth/token {
        limit_req zone=login burst=5 nodelay;
        limit_conn connperip 20;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 1m;
    }

    location /api/ {
        limit_req zone=api burst=300 nodelay;
        limit_conn connperip 100;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 修正后端重定向: http://localhost:8080/... → https://localhost:8080/...
        proxy_redirect ~^http://([^/]+)(/.*)?$ https://$http_host$2;

        # 隐藏后端框架信息
        proxy_hide_header X-Powered-By;

        # SSE 流式 + 大文件支持
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        client_max_body_size 100m;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # CAD 桥接 WebSocket 代理
    location /ws/bridge {
        proxy_pass http://host.docker.internal:9527;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 注意：不要为 5xx 配置指向 /50x.html 的 error_page —— 该文件不在静态根目录中，
    # 缺失时 nginx 会把 503/502 改写成 404，掩盖真实错误（曾导致批量导入被限流后报 404）。
}
